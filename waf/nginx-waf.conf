# =============================================================================
#  nginx-waf.conf — virtual host del WAF (proxy inverso + ModSecurity)
# =============================================================================
#
#  Se instala como /etc/nginx/sites-available/default (el sitio por defecto del
#  nginx del contenedor).
#
#  Dos ideas clave:
#
#  1) El WAF es un PROXY INVERSO. No es un filtro magico: es un servidor web que
#     recibe la peticion, la inspecciona con ModSecurity y, solo si la considera
#     aceptable, la reenvia al backend real (Juice Shop).
#
#  2) El nombre "juice-shop" se resuelve por el DNS interno de Docker, porque
#     ambos contenedores estan en la misma red. No se usan IPs a mano.
#
#  Nota sobre $host, $remote_addr, etc.: son variables INTERNAS de nginx (datos
#  de la peticion en curso), no variables de entorno del sistema. Son la forma
#  estandar y obligatoria de escribir un proxy; no se configuran desde fuera.
# =============================================================================

server {
    listen 80;
    server_name _;

    # --- Activacion del WAF --------------------------------------------------
    # "modsecurity on" enciende el modulo para este servidor, y
    # "modsecurity_rules_file" indica el UNICO punto de entrada de la config:
    # a partir de ahi, main.conf carga el motor, el CRS y las reglas.
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    client_max_body_size 10m;

    # --- Proxy inverso hacia Juice Shop -------------------------------------
    location / {
        proxy_pass http://juice-shop:3000;

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
