# =============================================================================
#  tuning-local.conf — ajustes locales del WAF
# =============================================================================
#
#  Este fichero se carga EL ULTIMO (ver main.conf), asi que lo que escribas aqui
#  gana sobre modsecurity.conf y sobre crs-setup.conf. Es el sitio correcto para
#  hacer tuning: nunca se editan las reglas de CRS directamente, porque se
#  perderian al actualizar el conjunto de reglas.
#
#  Este fichero esta montado desde el HOST (bind mount), asi que puedes editarlo
#  con tu editor normal y aplicar los cambios sin reconstruir la imagen:
#
#      docker exec waf-proxy nginx -t          # comprobar sintaxis
#      docker exec waf-proxy nginx -s reload   # recargar en caliente
#
#  Las celdas de la Parte 2 del notebook hacen exactamente eso, automatizado.
# =============================================================================

# --- Ejemplo 1: pasar el WAF a modo auditoria (detecta pero no bloquea) ------
# Descomenta la linea siguiente, recarga nginx y repite un ataque: veras que
# ahora devuelve 200 (llega a Juice Shop) pero SIGUE apareciendo en el log.
#SecRuleEngine DetectionOnly

# --- Ejemplo 2: subir el nivel de paranoia de CRS ----------------------------
# El paranoia level decide CUANTAS reglas se activan (PL1 por defecto, hasta
# PL4). No es lo mismo que el umbral de anomaly score: son dos cosas distintas.

# --- Ejemplo 3: cambiar el umbral de anomaly score ---------------------------
# Umbral por defecto: 5 de entrada, 4 de salida. Subirlo hace el WAF mas
# permisivo (la documentacion oficial de CRS desaconseja subirlo).
#SecAction "id:90002,phase:1,pass,nolog,setvar:tx.inbound_anomaly_score_threshold=10"

# --- Ejemplo 4: excluir un falso positivo concreto ---------------------------
# Lo correcto es excluir UNA variable de UNA regla, no desactivar la regla
# entera. Por ejemplo, si la regla 941320 saltase con el campo "comentario":
#SecRuleUpdateTargetById 941320 "!ARGS:comentario"
