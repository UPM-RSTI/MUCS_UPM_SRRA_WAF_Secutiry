# =============================================================================
#  main.conf — orden de carga de ModSecurity
# =============================================================================
#
#  Este es el unico fichero al que apunta nginx (directiva
#  "modsecurity_rules_file" en nginx-waf.conf). Todo lo demas se carga desde
#  aqui, y EL ORDEN IMPORTA: ModSecurity procesa las directivas segun las va
#  leyendo, asi que lo ultimo que se carga es lo que gana.
#
#      1. modsecurity.conf   -> como se comporta el MOTOR (engine, logs, limites)
#      2. crs-setup.conf     -> como se comporta CRS (paranoia, umbrales)
#      3. rules/*.conf       -> las REGLAS en si (SQLi 942xxx, XSS 941xxx, ...)
#      4. tuning-local.conf  -> nuestros ajustes locales, cargados al final
#                               para poder sobreescribir cualquier cosa anterior
#
#  Si quieres ver este orden "en vivo" dentro del contenedor:
#      docker exec waf-proxy cat /etc/nginx/modsec/main.conf
#      docker exec waf-proxy ls /etc/nginx/modsec/coreruleset/rules/
# =============================================================================

Include /etc/nginx/modsec/modsecurity.conf
Include /etc/nginx/modsec/coreruleset/crs-setup.conf
Include /etc/nginx/modsec/coreruleset/rules/*.conf
Include /etc/nginx/modsec/tuning-local.conf
