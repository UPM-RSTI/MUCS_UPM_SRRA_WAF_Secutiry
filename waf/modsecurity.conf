# =============================================================================
#  modsecurity.conf — configuracion del MOTOR ModSecurity
# =============================================================================
#
#  Esto NO son reglas de ataque: son los parametros del motor que ejecuta las
#  reglas. En una instalacion normal este fichero sale de
#  "modsecurity.conf-recommended"; aqui esta escrito a mano y comentado para que
#  se entienda cada directiva.
#
#  Nada de esto se configura con variables de entorno: si quieres cambiar algo,
#  editas este fichero (o tuning-local.conf) y recargas nginx. Igual que en un
#  servidor de verdad.
# =============================================================================

# --- Motor de reglas ---------------------------------------------------------
#   On             -> inspecciona Y bloquea
#   DetectionOnly  -> inspecciona y registra, pero NO bloquea (modo auditoria)
#   Off            -> ni inspecciona
# OJO: el valor por defecto recomendado por upstream es DetectionOnly. Aqui lo
# ponemos explicitamente en On porque la practica consiste en ver bloqueos.
SecRuleEngine On

# --- Cuerpo de la peticion ---------------------------------------------------
# Sin esto, ModSecurity solo veria la URL y las cabeceras: un POST de login con
# una inyeccion SQL en el cuerpo pasaria sin inspeccionar.
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# --- Seleccion del parser del cuerpo segun el Content-Type -------------------
# IMPRESCINDIBLE para detectar ataques dentro de un cuerpo JSON (como el login
# de Juice Shop, que envia {"email":...,"password":...}).
#
# Por defecto ModSecurity solo descompone en argumentos (ARGS) los cuerpos de
# tipo formulario (application/x-www-form-urlencoded). Un cuerpo JSON NO se
# parsea salvo que se lo pidamos explicitamente con "ctl:requestBodyProcessor".
# Sin estas dos reglas, un SQL Injection metido en un campo JSON nunca llega a
# ARGS y las reglas 942xxx de CRS no lo ven: la peticion pasa con 200.
#
# Son exactamente las reglas que trae el modsecurity.conf recomendado de
# upstream; las ponemos aqui porque este fichero esta escrito desde cero.
SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json" \
    "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

SecRule REQUEST_HEADERS:Content-Type "@rx ^(?:application(?:/soap\+|/)|text/)xml" \
    "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"

# --- Cuerpo de la respuesta --------------------------------------------------
# Permite detectar fugas de datos en lo que devuelve el backend (reglas 95xxxx).
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 1048576
SecResponseBodyLimitAction ProcessPartial

# --- Ficheros temporales y estado --------------------------------------------
SecTmpDir  /tmp/
SecDataDir /tmp/

# --- Log de auditoria --------------------------------------------------------
#   RelevantOnly -> solo registra transacciones "interesantes" (ver el regex de
#                   abajo: errores 4xx/5xx, excluyendo los 404 normales)
# El fichero se escribe en /var/log/modsec/, que montaremos como carpeta del
# host para poder analizarlo desde fuera con cat / grep / jq.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHKZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec/audit.log
SecAuditLogFormat JSON

# --- Varios ------------------------------------------------------------------
SecArgumentSeparator &
SecCookieFormat 0
SecStatusEngine Off
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000
